services:
  - type: worker
    name: gathering-of-the-fallen-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
      - key: ADMIN_CHAT_ID
        sync: false
      - key: BAND_SITE_URL
        value: https://gathering-of-the-fallen.replit.app/
      - key: AI_COOLDOWN_SECONDS
        value: "4"
    disk:
      name: bot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
