services:
  - type: web
    name: gathering-of-the-fallen-mini-app
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --global pnpm@10.26.1 && pnpm install --frozen-lockfile && BASE_PATH=/ pnpm --filter @workspace/fallen-mini-app build && pnpm --filter @workspace/api-server build
    preDeployCommand: pnpm --filter @workspace/db push
    startCommand: pnpm --filter @workspace/api-server start
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gathering-of-the-fallen-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  - type: worker
    name: gathering-of-the-fallen-bot
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: onyx
      - key: ADMIN_CHAT_ID
        sync: false
      - key: BAND_SITE_URL
        sync: false
      - key: AI_COOLDOWN_SECONDS
        value: "4"
      - key: VOICE_REPLY_MAX_CHARS
        value: "700"
      - key: VOICE_REPLY_DAILY_LIMIT
        value: "10"
    disk:
      name: bot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

databases:
  - name: gathering-of-the-fallen-db
    plan: basic-256mb
    region: frankfurt
